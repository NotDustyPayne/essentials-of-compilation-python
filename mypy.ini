# Type checking for the support code. Run from this directory:
#
#     .venv/bin/mypy .
#
# Every file gets mypy's default checks. Files that have been fully annotated
# also get the --strict flags (the [strict] section below). As more chapters
# get typed, add their modules to that section; it only ever grows.

[mypy]
# The venv runs 3.12, but checking against the 3.13 stdlib stubs lets the book's
# style of building ASTs typecheck: `Call(func, args)` and `Module(body)`
# leave out the optional `keywords` / `type_ignores` fields, which Python 3.13
# made officially optional.
python_version = 3.13
mypy_path = stubs:.
explicit_package_bases = True
exclude = (?x)(
    ^lark/                     # vendored parser library (stubbed in stubs/lark)
  | ^tests/                    # test programs are in the book's languages
  | ^interp_x86/x86exp\.py$    # dead file; imports a module that doesn't exist
  | ^\.venv/
  )
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
strict_equality = True
extra_checks = True

# Optional dependencies, only used for debug printing / graph drawing.
[mypy-graphviz.*,pandas.*]
ignore_missing_imports = True

# ---------------------------------------------------------------------------
# Strict: fully annotated modules (chapters 1-2 and the shared infrastructure)
# ---------------------------------------------------------------------------
[mypy-utils,x86_ast,compiler,interp_Lint,interp_Lvar,type_check_Lvar,interp_x86.*,run-tests,simple-test]
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
warn_return_any = True

# ---------------------------------------------------------------------------
# Known issue, for chapter 7+ (functions onward)
# ---------------------------------------------------------------------------
# utils.FunctionType (the book's function *type*) shadows ast.FunctionType at
# runtime because `from utils import *` comes after `from ast import *`. mypy
# keeps the first definition, so in these modules it thinks FunctionType is
# ast.FunctionType. Fix this properly when typing the Lfun chapter.
[mypy-type_check_Lgeneric]
disable_error_code = assignment
